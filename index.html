<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festive Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Christmas-themed video background (fixed) -->
  <video autoplay muted loop playsinline id="xmas-video">
    <source src="xmas.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Overlay for dimming -->
  <div class="overlay-container">
    <div id="video-overlay"></div>
  </div>

  <!-- Dim control -->
  <div class="overlay-control">
    <label for="overlay-slider">Background Dim</label>
    <input type="range" id="overlay-slider" min="0" max="90" value="35" step="1">
    <span class="value" id="overlay-value">35%</span>
  </div>

  <!-- Snow container -->
  <div class="snow" aria-hidden="true"></div>

  <!-- Calculator UI -->
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">AC</button>
      <button class="delete" onclick="deleteLastChar()">DEL</button>
      <button class="operator" onclick="appendOperator('/')">÷</button>
      <button class="operator" onclick="appendOperator('*')">×</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="appendOperator('-')">−</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="appendOperator('+')">+</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="equals" onclick="calculate()">=</button>

      <button class="zero" onclick="appendNumber('0')">0</button>
      <button onclick="appendNumber('.')">.</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
